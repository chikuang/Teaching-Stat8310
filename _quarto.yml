project:
  type: book

book:
  title: "STAT8310 - Bayesian Data Analysis"
  subtitle: "Spring 2027"
  author: "Chi-Kuang Yeh"
  date: today
  chapters:
    - index.qmd
    - 01_intro.qmd
    - 02_probability.qmd
    - 03_bi-1par.qmd
    - 04_MC.qmd
    - 05_Gibbs_sampler.qmd
    - 06_MCMC_diagnosis.qmd
    - 07_MVN.qmd
    - 08_BML.qmd
    - 09_VI_GP.qmd
    - part: "Project"
      chapters:
        - project.qmd
    - part: "Appendix"
      chapters:
        - App_A-intro-R.qmd
        - App_B-jags.qmd
    - references.qmd
  navbar:
    right:
      - icon: github
        href: https://github.com/chikuang/Teaching-Stat8310/tree/2027S
        aria-label: GitHub
      - icon: file-pdf
        href: ./STAT8310---Bayesian-Data-Analysis.pdf
        aria-label: Download PDF

bibliography: references.bib

execute:
  cache: true
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - brand
    css: custom-callouts.css
    filters: []
    cache: true
  pdf:
    documentclass: scrreprt
    monofont: Menlo
    fig-pos: H
    colorlinks: true
    linkcolor: CourseAccent
    urlcolor: CourseAccent
    citecolor: CourseAccent
    toccolor: CourseAccent
    filecolor: CourseAccent
    geometry:
      - margin=1in
      - headheight=38pt
      - headsep=12pt
      - footskip=36pt
    include-in-header:
      - pdf-environments.tex
      - pdf-page-style.tex
    filters:
      - filters/pdf-callouts.lua
      - filters/pdf-layout.lua
      - filters/course-links.lua
    cache: true

editor: visual
